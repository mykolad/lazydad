# LazyDad's alert rules, in the Prometheus rule-file format. Import them once as Grafana-managed rules (runbook
# section 11, step 4): Alerting -> Alert rules -> More -> Import to Grafana-managed rules, source "YAML file", the
# stack's Prometheus data source (grafanacloud-<stack>-prom). Alerts go to the default notification policy.
#
# Production only: its two apps, lazydad-app (West Europe) and lazydad-app-swedencentral (the job label is the app's
# name). Staging scales to zero and runs a tick only when it starts. The scheduler's counters start at 0 when an app
# starts (SchedulerMetrics.Initialize), so increase() also counts the first tick after a restart.
groups:
  - name: lazydad
    interval: 5m
    rules:
      - alert: LazyDadTickFailed
        expr: sum by (job) (increase(lazydad_scheduler_ticks_total{job=~"lazydad-app|lazydad-app-swedencentral", outcome="failed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 'A scheduler tick failed on {{ $labels.job }}.'
          description: >-
            The whole tick failed (no jokes, no leaderboard). /status shows the exception type; the logs
            ({service_name="{{ $labels.job }}"}) show the error.

      - alert: LazyDadNoJokeSaved
        # Ticks run every 4 hours, on one app or the other (the scheduler lease): counted across both. A restart in the 2
        # hours before a due time skips that tick (its startup tick already made the batch), so jokes can be 6 hours apart
        # (a 5-hour window alerted after deploys, 2026-10-03). 7 hours without a saved joke means one was really missed.
        # "or vector(0)": no data also alerts.
        expr: >-
          (sum(increase(lazydad_jokes_total{job=~"lazydad-app|lazydad-app-swedencentral", outcome="saved"}[7h]))
          or vector(0)) < 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No joke saved in production for 7 hours.
          description: >-
            Every model failed, or no tick ran (both apps are down, or their schedulers stopped). Check /status and
            the logs.

      - alert: LazyDadAppNotReporting
        # One alert per app. Every app sends its scheduler counters once a minute, from the moment it starts, even
        # between ticks. Nothing for 10 minutes: the app is down, stuck or restarting over and over. Traffic Manager
        # should have taken its region out of lazydad.fyi by then (its /healthz fails too); this makes sure you hear.
        expr: >-
          absent_over_time(lazydad_scheduler_ticks_total{job="lazydad-app"}[10m])
          or absent_over_time(lazydad_scheduler_ticks_total{job="lazydad-app-swedencentral"}[10m])
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} has sent no metrics for 10 minutes.'
          description: >-
            The app is down, stuck or restarting over and over (or can't reach Grafana). Check its revision in the
            portal and its console logs in Log Analytics (runbook section 1), and Traffic Manager's endpoint status
            (runbook section 10).

      - alert: LazyDadJokeFailed
        # One alert per app and model: its joke failed (the model errored on every try, or saving the joke did) or came back
        # empty on every try (JokeGeneration:Attempts, 3).
        # Slow answers aren't failures.
        expr: >-
          sum by (job, model) (increase(lazydad_jokes_total{job=~"lazydad-app|lazydad-app-swedencentral",
          outcome=~"failed|empty"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'The joke from {{ $labels.model }} failed or came back empty on {{ $labels.job }}.'
          description: >-
            Either the model errored or answered with no text (log lines "Failed to generate joke", with the provider's
            error response, and "LLM returned an empty response"), or its joke couldn't be saved ("Failed to persist
            joke": the database). The other models' jokes were still saved.

      - alert: LazyDadLeaderboardFailed
        expr: sum by (job) (increase(lazydad_leaderboard_updates_total{job=~"lazydad-app|lazydad-app-swedencentral", outcome="failed"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'The Top 3 update failed on {{ $labels.job }}.'
          description: >-
            The judge's call or the leaderboard's database write failed, and the Top 3 stays as it was. The log line
            "Failed to update the top jokes" includes the provider's error response. The update runs even when no new
            joke was saved, so check LazyDadJokeFailed too: if every model failed as well, start there.

      - alert: LazyDadServerErrors
        expr: >-
          sum by (job) (increase(http_server_request_duration_seconds_count{job=~"lazydad-app|lazydad-app-swedencentral",
          http_route!="/healthz", http_response_status_code=~"5.."}[15m])) > 2
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} answered more than 2 requests with a server error in 15 minutes.'
          description: The dashboard's "Responses per second, by status code" panel (for that app) and the logs show which.
