name: CD

# Build once, promote the same image: staging (migrate, deploy, smoke tests), then production.
# Runs after CI succeeds on a push to master, or manually (e.g. to redeploy master).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment halfway; later runs queue behind it.
concurrency:
  group: cd
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: lazydadacr.azurecr.io

jobs:
  build:
    name: build image + migration bundle
    # workflow_run also fires for PR runs whose head branch is named "master" (e.g. from a
    # fork), so require a push to this repository. Manual runs are limited to master by the
    # environment's branch policy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The staging environment scopes this job's Azure OIDC identity (it only needs AcrPush here).
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tag
        id: meta
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build EF migration bundle
        run: |
          dotnet tool restore
          # `migrations bundle` reads the projects' assets files but doesn't restore them itself;
          # restore for the bundle's target runtime (this also restores LazyDad.Data).
          dotnet restore src/LazyDad.Api -r linux-x64
          dotnet ef migrations bundle --project src/LazyDad.Data --startup-project src/LazyDad.Api \
            --configuration Release --self-contained --target-runtime linux-x64 --output efbundle --force

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle
          retention-days: 7

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name lazydadacr
          image="$REGISTRY/lazydad:${{ steps.meta.outputs.tag }}"
          docker build -t "$image" .
          docker push "$image"
          echo "Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      app-name: lazydad-app-staging
      restricted-ingress: true
      tag: ${{ needs.build.outputs.tag }}
      ref: ${{ needs.build.outputs.ref }}
    secrets: inherit

  production:
    needs: [build, staging]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      app-name: lazydad-app
      tag: ${{ needs.build.outputs.tag }}
      ref: ${{ needs.build.outputs.ref }}
    secrets: inherit
