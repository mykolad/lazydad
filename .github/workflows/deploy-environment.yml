name: Deploy Environment

# Reusable: migrate the environment's DB, roll one app to the image, then smoke-test it.
# Called by Deploy Master (staging, then each of production's apps), Deploy Branch to Staging and Roll Back
# Production, so every environment and every deploy path runs exactly the same steps.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (scopes the Azure OIDC login)
        required: true
        type: string
      app-name:
        description: Container App to update
        required: true
        type: string
      tag:
        description: Image tag (short commit SHA), shown in the summary and expected by the smoke tests as the version
        required: true
        type: string
      ref:
        description: Commit to check out for the smoke tests
        required: true
        type: string
      digest:
        description: Image digest (sha256:...) the revision is pinned to
        required: true
        type: string
      run-migrations:
        description: Apply the EF migration bundle before rolling out (branch deploys to staging opt in)
        required: true
        type: boolean
      instance:
        description: >-
          Which of the environment's apps, for the image tags that keep what it runs from the purge: empty for the
          environment's first app (deployed-<environment>, ...), a region for another one (deployed-<environment>-<region>),
          so each app's running image stays tagged.
        required: false
        default: ''
        type: string
      revision-prefix:
        description: >-
          Starts the revision suffix, followed by the run ID and attempt: "r" for deploys, "rb" for
          rollbacks (Deploy Master deploys and rolls back production in one run). Deploy Master
          names production's revision "<app-name>--r<run ID>-<attempt>" for an automatic rollback.
        required: false
        default: r
        type: string
    outputs:
      previous-digest:
        description: >-
          The digest of the image that served before this rollout, read from the environment's own
          revisions by this job (empty if the job stopped before that). Deploy Master's automatic rollback
          returns to it: unlike the previous-<env> tag, nothing outside this job can change it.
        value: ${{ jobs.deploy.outputs.previous-digest }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RESOURCE_GROUP: lazydad-rg
  SQL_SERVER: lazydad-sql-swedencentral
  REGISTRY: lazydadacr.azurecr.io
  # Every build lands in lazydad-preview, which staging runs from. Production runs only from lazydad, which only
  # production's deploy identity can write: it copies the digest staging tested (see "Put the image into ...").
  # So a previewed branch, which can write lazydad-preview only, can't touch what production runs or its tags.
  REPOSITORY: ${{ inputs.environment == 'production' && 'lazydad' || 'lazydad-preview' }}
  # The protection tags' suffix: production's two apps can briefly run different images (one rolled out, the other
  # not yet), so each has its own deployed-/previous-/deploying- tags.
  TARGET: ${{ inputs.environment }}${{ inputs.instance != '' && format('-{0}', inputs.instance) || '' }}

jobs:
  deploy:
    name: deploy (${{ inputs.app-name }})
    runs-on: ubuntu-latest
    # Up to about 17 minutes per smoke-test attempt if every wait times out, and there can be two; plus up to 10 for
    # removing this runner from the IP restrictions while the app is busy, which must not be cut off.
    timeout-minutes: 55
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.app.outputs.url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      previous-digest: ${{ steps.protect.outputs.previous-digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Built by build-image.yml. Roll Back Production neither builds nor migrates, so there's none.
      - uses: actions/download-artifact@v8
        if: ${{ inputs.run-migrations }}
        with:
          name: efbundle

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The runner's IP is unpredictable: it's allowed through the SQL firewall only while migrating,
      # and through the app's IP restrictions (if it has any) only during the smoke tests.
      - name: Detect runner IP
        id: runner
        run: echo "ip=$(curl -fsS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Open SQL firewall for this runner
        id: firewall
        if: ${{ inputs.run-migrations }}
        run: |
          rule="gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.environment }}"
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$rule" \
            --start-ip-address "${{ steps.runner.outputs.ip }}" --end-ip-address "${{ steps.runner.outputs.ip }}" -o none
          echo "rule=$rule" >> "$GITHUB_OUTPUT"

      - name: Apply EF migrations
        if: ${{ inputs.run-migrations }}
        run: |
          # No password: log in with Entra ID as this job's identity. azure/login left the runner signed in
          # as the environment's deploy identity (lazydad-github-cd for production, lazydad-github-staging
          # for staging), which "Active Directory Default" picks up through the Azure CLI.
          case "${{ inputs.environment }}" in
            production) database=lazydad-db ;;
            staging) database=lazydad-db-staging ;;
            *) echo "::error::No database known for environment '${{ inputs.environment }}'."; exit 1 ;;
          esac
          connection="Server=tcp:$SQL_SERVER.database.windows.net,1433;Database=$database;Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60"
          echo "Migrating $database with Entra ID."
          chmod +x ./efbundle
          # A paused serverless DB (staging) can take a minute to resume; retry the whole bundle.
          for attempt in 1 2 3; do
            ./efbundle --connection "$connection" && exit 0
            echo "::warning::Migration attempt $attempt failed; retrying in 30s."
            sleep 30
          done
          echo "::error::Migrations failed after 3 attempts."
          exit 1

      - name: Close SQL firewall
        if: ${{ always() && steps.firewall.outputs.rule != '' }}
        run: az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "${{ steps.firewall.outputs.rule }}"

      # The environment's repository must have the digest under its commit tag (Roll Back Production finds images by
      # it). A new build is only in lazydad-preview, so production copies it; a rollback's image is already in lazydad,
      # but the purge may have removed its commit tag, so it's tagged again. The copy keeps the digest, and it's
      # checked: production must run exactly what staging tested.
      - name: Put the image into ${{ env.REPOSITORY }}
        run: |
          az acr login --name lazydadacr
          tagged=$(az acr manifest show-metadata -r lazydadacr -n "$REPOSITORY:${{ inputs.tag }}" --query digest -o tsv 2> /dev/null || true)
          if [ "$tagged" = "${{ inputs.digest }}" ]; then
            echo "$REPOSITORY:${{ inputs.tag }} is already ${{ inputs.digest }}."
            exit 0
          fi
          if az acr manifest show -r lazydadacr -n "$REPOSITORY@${{ inputs.digest }}" -o none 2> /dev/null; then
            src="$REGISTRY/$REPOSITORY@${{ inputs.digest }}"
          else
            src="$REGISTRY/lazydad-preview@${{ inputs.digest }}"
          fi
          dst="$REGISTRY/$REPOSITORY:${{ inputs.tag }}"
          docker pull -q "$src"
          docker tag "$src" "$dst"
          docker push -q "$dst"
          copied=$(az acr manifest show-metadata -r lazydadacr -n "$REPOSITORY:${{ inputs.tag }}" --query digest -o tsv)
          if [ "$copied" != "${{ inputs.digest }}" ]; then
            echo "::error::Copying ${{ inputs.digest }} into $REPOSITORY produced $copied: not the image staging tested."
            exit 1
          fi
          echo "Tagged ${{ inputs.digest }} in $REPOSITORY as ${{ inputs.tag }} (from $src)."

      # Two-phase protection from the weekly purge (which deletes only commit-style tags, then
      # untagged manifests), so the job can stop at any point and whatever runs is still tagged:
      #   1. before the rollout: re-tag what currently runs as deployed-<env> (this also repairs an
      #      earlier interrupted run) and previous-<env>, and tag the new digest deploying-<env>;
      #   2. after the rollout: move deployed-<env> to the new digest.
      - name: Protect the running and the new image
        id: protect
        run: |
          az acr login --name lazydadacr
          retag() { docker pull -q "$1" && docker tag "$1" "$2" && docker push -q "$2"; }
          # The image of the revision actually serving traffic, not the app's desired template:
          # after a failed rollout the template names the failed image while an older one serves.
          serving=$(az containerapp revision list -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" \
            --query '[?properties.trafficWeight > `0`].properties.template.containers[0].image' -o tsv)
          count=$(printf '%s\n' "$serving" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one revision serving traffic, found $count; not moving any tags."
            exit 1
          fi
          # What served before this rollout, as read from the environment's own revisions: the automatic
          # rollback's target (a job output, which nothing outside this job can change; tags can be moved by
          # anyone who can write the environment's repository). Revisions are pinned by digest, so the image names it.
          case "$serving" in
            *@sha256:*) echo "previous-digest=${serving#*@}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::The serving revision isn't pinned to a digest ($serving); an automatic rollback won't have a target." ;;
          esac
          # Fatal on failure (bash -e): never move the candidate tag while the serving image is unprotected.
          retag "$serving" "$REGISTRY/$REPOSITORY:deployed-$TARGET"
          # What served before this rollout, kept from the purge so a manual rollback can still return to it.
          retag "$serving" "$REGISTRY/$REPOSITORY:previous-$TARGET"
          retag "$REGISTRY/$REPOSITORY@${{ inputs.digest }}" "$REGISTRY/$REPOSITORY:deploying-$TARGET"

      - name: Roll out ${{ inputs.tag }}
        id: app
        run: |
          # A unique revision suffix forces a new revision even on a re-run of the same tag, so the
          # startup tick (which the smoke tests verify via /status) always happens. The resulting
          # revision name is what /healthz reports, so the smoke tests can tell this rollout apart
          # from the draining one even when both run the same commit.
          # run_id, not run_number: run numbers restart when a workflow file is renamed, which
          # would reuse existing revision names (r2-1, ...) and make the rollout fail.
          # The revision is pinned to the immutable digest, not the commit tag: Container Apps resolves
          # the configured image again on every replica start, and the weekly purge may delete old
          # commit tags. The digest stays pullable as long as the manifest exists, which the
          # deployed-*/deploying-* tags guarantee (see "Protect the running and the new image").
          # The version comes from the image itself (see Dockerfile). Removing App__Version drops the
          # deploy-time override older deploys set (only a warning once it's gone), so a container
          # setting can never contradict the image.
          suffix="${{ inputs.revision-prefix }}${{ github.run_id }}-${{ github.run_attempt }}"
          az containerapp update -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" \
            --image "$REGISTRY/$REPOSITORY@${{ inputs.digest }}" \
            --remove-env-vars App__Version \
            --revision-suffix "$suffix" -o none
          echo "revision=${{ inputs.app-name }}--$suffix" >> "$GITHUB_OUTPUT"
          fqdn=$(az containerapp show -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      # Phase 2: the new digest now runs, so it becomes deployed-<env> (it was pulled in phase 1).
      - name: Tag the image as deployed-${{ env.TARGET }}
        run: |
          dst="$REGISTRY/$REPOSITORY:deployed-$TARGET"
          docker tag "$REGISTRY/$REPOSITORY@${{ inputs.digest }}" "$dst"
          docker push -q "$dst"

      # Behind Cloudflare (runbook section 10), the app's ingress admits only Cloudflare's IPv4 ranges, and the addresses
      # Traffic Manager's health checks come from (so they reach /healthz and can take a region out when its app is
      # down). The environment's CLOUDFLARE_ONLY_INGRESS variable is the switch: "true" (production, once lazydad.fyi
      # works through Cloudflare) makes every deploy create those rules if there are none and keep them current with
      # both published lists (one update of the whole rule list, so it changes at once); anything else removes them
      # (staging never has it). Not fatal: if either list can't be read, the rules stay as they are, and the weekly Check
      # Cloudflare Ranges run notices a real change of Cloudflare's. If the update itself fails, the warning says so and
      # how to look at the rules. A rollback to a commit from before the script skips this; one from before Traffic
      # Manager keeps the trafficmanager-* rules as they are.
      - name: Sync Cloudflare's and Traffic Manager's ranges on the app's ingress
        env:
          MODE: ${{ vars.CLOUDFLARE_ONLY_INGRESS == 'true' && 'on' || 'off' }}
        run: |
          if [ ! -f tools/cloudflare-ranges.sh ]; then
            echo "This commit has no tools/cloudflare-ranges.sh; the ingress rules stay as they are."
            exit 0
          fi
          # The rule-name tag is unique per sync: a re-run (a new attempt) or the automatic rollback in the same run
          # ("rb" instead of "r") must not reuse, and so overwrite, rules an earlier sync added.
          bash tools/cloudflare-ranges.sh sync "${{ inputs.app-name }}" "$RESOURCE_GROUP" \
            "${{ inputs.revision-prefix }}${{ github.run_id }}-${{ github.run_attempt }}" "$MODE" ||
            echo "::warning::Couldn't finish syncing Cloudflare's and Traffic Manager's ranges on ${{ inputs.app-name }}'s ingress (CLOUDFLARE_ONLY_INGRESS: $MODE). Its rules may be partly changed; see the log above, and check them with: az containerapp ingress access-restriction list -n ${{ inputs.app-name }} -g $RESOURCE_GROUP -o table"

      # With any Allow rule, Container Apps denies every other address: staging lists the owner's IP, and production
      # behind Cloudflare lists Cloudflare's and Traffic Manager's ranges (runbook section 10). Then allow this runner
      # only for the smoke tests, which call the app's own address. Ingress rules are app-level config, so this doesn't
      # create a revision.
      - name: Allow this runner through the app's IP restrictions
        id: ingress
        run: |
          allows=$(az containerapp ingress access-restriction list -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" \
            --query "length([?action=='Allow'])" -o tsv)
          if [ "${allows:-0}" -eq 0 ]; then
            echo "The app has no IP restrictions; the smoke tests can reach it as they are."
            exit 0
          fi
          rule="gh-${{ github.run_id }}-${{ github.run_attempt }}"
          az containerapp ingress access-restriction set -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" \
            --rule-name "$rule" --ip-address "${{ steps.runner.outputs.ip }}/32" --action Allow \
            --description "Smoke tests, ${{ github.workflow }} run ${{ github.run_id }}" -o none
          echo "rule=$rule" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Smoke tests
        env:
          SMOKE_BASE_URL: ${{ steps.app.outputs.url }}
          SMOKE_EXPECTED_VERSION: ${{ inputs.tag }}
          SMOKE_EXPECTED_REVISION: ${{ steps.app.outputs.revision }}
        # One retry, after restarting the revision: its startup tick is the only one the smoke tests
        # can wait for, and a transient LLM error there would otherwise stay on /status for hours.
        run: |
          smoke() { dotnet test tests/LazyDad.SmokeTests -c Release --logger "console;verbosity=normal"; }
          smoke && exit 0
          echo "::warning::Smoke tests failed; restarting revision ${{ steps.app.outputs.revision }} and retrying once."
          # The restarted process keeps the revision name, and the old one can still answer (and even finish its tick)
          # for a moment. Each process reports its own id on /status, so the retry only accepts a different one.
          # Read from this revision only (a draining one may still answer), and never retry without it: an empty id
          # would let the old process pass the retry.
          SMOKE_NOT_PROCESS=""
          for _ in $(seq 1 12); do
            SMOKE_NOT_PROCESS=$(curl -fsS --max-time 20 "$SMOKE_BASE_URL/status" |
              jq -r --arg revision "$SMOKE_EXPECTED_REVISION" 'select(.revision == $revision) | .process // empty') || SMOKE_NOT_PROCESS=""
            [ -n "$SMOKE_NOT_PROCESS" ] && break
            sleep 5
          done
          if [ -z "$SMOKE_NOT_PROCESS" ]; then
            echo "::error::Couldn't read the process id of $SMOKE_EXPECTED_REVISION from /status, so the retry couldn't tell the restarted process from the old one; not retrying."
            exit 1
          fi
          export SMOKE_NOT_PROCESS
          az containerapp revision restart -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" \
            --revision "${{ steps.app.outputs.revision }}" -o none
          smoke

      - name: Remove this runner from the app's IP restrictions
        if: ${{ always() && steps.ingress.outputs.rule != '' }}
        run: |
          # Another change to the app can be under way (a setting, a restart; e.g. its owner's az containerapp update):
          # Azure then refuses with ContainerAppOperationInProgress. Keep trying for 8 minutes rather than leave this
          # runner's address admitted; a rule that's already gone counts as removed.
          rule="${{ steps.ingress.outputs.rule }}"
          # (8, not the 10 the job allows for this: the last az calls and the error below must fit too.)
          deadline=$((SECONDS + 480))
          while true; do
            if names=$(az containerapp ingress access-restriction list -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" --query "[].name" -o tsv); then
              grep -qxF "$rule" <<< "$names" || exit 0
              az containerapp ingress access-restriction remove -n "${{ inputs.app-name }}" -g "$RESOURCE_GROUP" --rule-name "$rule" -o none && exit 0
            fi
            (( SECONDS + 20 < deadline )) || break
            echo "::warning::Couldn't remove $rule yet; trying again in 20 s."
            sleep 20
          done
          echo "::error::Couldn't remove $rule from ${{ inputs.app-name }}'s IP restrictions. Remove it by hand: az containerapp ingress access-restriction remove -n ${{ inputs.app-name }} -g $RESOURCE_GROUP --rule-name $rule"
          exit 1

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### ${{ inputs.app-name }} (${{ inputs.environment }})"
            echo "- App: \`${{ inputs.app-name }}\`, image \`${{ env.REPOSITORY }}:${{ inputs.tag }}\` pinned to \`${{ inputs.digest }}\`, revision \`${{ steps.app.outputs.revision }}\`"
            echo "- URL: ${{ steps.app.outputs.url }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
