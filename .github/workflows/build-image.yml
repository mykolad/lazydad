name: Build Image

# Reusable: build the app image and the EF migration bundle once, for any commit.
# Called by Deploy Master (master) and Deploy Branch to Staging (any branch).
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
    outputs:
      tag:
        description: Image tag (short commit SHA)
        value: ${{ jobs.build.outputs.tag }}
      ref:
        description: Full commit SHA that was built
        value: ${{ jobs.build.outputs.ref }}
      digest:
        description: Pushed image digest (sha256:...), which deployments pin to
        value: ${{ jobs.build.outputs.digest }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: lazydadacr.azurecr.io

jobs:
  build:
    name: build image + migration bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The staging environment scopes this job's Azure OIDC identity (it only needs AcrPush here).
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve tag
        id: meta
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build EF migration bundle
        run: |
          dotnet tool restore
          # `migrations bundle` reads the projects' assets files but doesn't restore them itself;
          # restore for the bundle's target runtime (this also restores LazyDad.Data).
          dotnet restore src/LazyDad.Api -r linux-x64
          dotnet ef migrations bundle --project src/LazyDad.Data --startup-project src/LazyDad.Api \
            --configuration Release --self-contained --target-runtime linux-x64 --output efbundle --force

      - uses: actions/upload-artifact@v7
        with:
          name: efbundle
          path: efbundle
          retention-days: 7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        id: push
        run: |
          az acr login --name lazydadacr
          image="$REGISTRY/lazydad:${{ steps.meta.outputs.tag }}"
          # Version metadata is baked into the image (see Dockerfile): App__* settings + OCI labels.
          docker build -t "$image" \
            --build-arg VERSION=${{ steps.meta.outputs.tag }} \
            --build-arg REVISION=${{ steps.meta.outputs.ref }} \
            --build-arg COMMIT_DATE="$(git show -s --format=%cI HEAD)" \
            --build-arg SOURCE_URL="${{ github.server_url }}/${{ github.repository }}" \
            .
          docker push "$image"
          # Deployments reference the immutable digest, not the tag (see Deploy Environment).
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          digest="${digest#*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$image\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"
