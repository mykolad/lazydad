name: Check Cloudflare Ranges

# Weekly: are Cloudflare's published IP ranges still the ones the app trusts (Cloudflare:IpRanges in appsettings.json)?
# If not, it opens an issue (or comments on the open one) listing what to add and remove, and fails, so a change
# can't go unnoticed. The fix is a PR updating appsettings.json; its deploy also brings the prod app's ingress rules
# up to date (Deploy Environment syncs them on every deploy). Once the lists match again, it closes the issue.
# No Azure login: it only reads Cloudflare's public API and the repository.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare with Cloudflare's list
        id: compare
        run: |
          set +e
          bash tools/cloudflare-ranges.sh check src/LazyDad.Api/appsettings.json > result.txt 2>&1
          code=$?
          set -e
          cat result.txt
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.compare.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Cloudflare's IP ranges changed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          case "$CODE" in
            0)
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "The app's list matches Cloudflare's again ($RUN_URL)."
              fi
              ;;
            1)
              body=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
                "Cloudflare's published ranges (https://www.cloudflare.com/ips/) no longer match \`Cloudflare:IpRanges\` in \`src/LazyDad.Api/appsettings.json\` ($RUN_URL)." \
                "$(cat result.txt)" \
                "Fix: update that list in a PR. Its deploy also syncs the prod app's ingress rules. Until then, visitors reaching the app through a new range aren't told apart for the vote limit, and if the app is locked to Cloudflare, a new range is only admitted after the next deploy (runbook section 12).")
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$body"
              else
                gh issue create --title "$title" --body "$body"
              fi
              exit 1
              ;;
            *)
              echo "::error::Couldn't read Cloudflare's list (see the log); nothing was compared."
              exit 1
              ;;
          esac
