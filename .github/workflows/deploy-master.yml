name: Deploy Master

# Build once, promote the same image: staging (migrate, deploy, smoke tests), then production.
# Runs after "Build and Test" succeeds on a push to master, or manually (e.g. to redeploy master).
on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Shared with Deploy Branch to Staging: both deploy staging, so they queue behind each other.
# Never cancel a deployment halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # workflow_run also fires for PR runs whose head branch is named "master" (e.g. from a
    # fork), so require a push to this repository. Manual runs are limited to master by the
    # production environment's branch policy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  staging:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      app-name: lazydad-app-staging
      restricted-ingress: true
      run-migrations: true
      tag: ${{ needs.build.outputs.tag }}
      ref: ${{ needs.build.outputs.ref }}
      digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  production:
    needs: [build, staging]
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      app-name: lazydad-app
      run-migrations: true
      tag: ${{ needs.build.outputs.tag }}
      ref: ${{ needs.build.outputs.ref }}
      digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
